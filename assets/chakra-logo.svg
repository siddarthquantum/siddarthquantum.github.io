</g>

<circle r="153" class="gold-line" stroke-width="1"/>
<circle r="122" class="gold-line" stroke-width="1"/>
<g class="counter"><text class="names"><textPath href="#ring-names" startOffset="10%">JIYA</textPath><textPath href="#ring-names" startOffset="20%" class="dot">•</textPath><textPath href="#ring-names" startOffset="30%">SIDDARTH</textPath><textPath href="#ring-names" startOffset="40%" class="dot">•</textPath><textPath href="#ring-names" startOffset="50%">SHANTI</textPath><textPath href="#ring-names" startOffset="60%" class="dot">•</textPath><textPath href="#ring-names" startOffset="70%">RAMDEO</textPath><textPath href="#ring-names" startOffset="80%" class="dot">•</textPath><textPath href="#ring-names" startOffset="90%">NEELAM</textPath><textPath href="#ring-names" startOffset="100%" class="dot">•</textPath></text></g>

